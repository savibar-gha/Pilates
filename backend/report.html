<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>+Pilates — Reporte de encuesta</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --brown:#3a2318;
    --orange:#e8842a;
    --peach:#f7e6d8;
    --peach-light:#fbf1e8;
    --muted:#8a7462;
    --bg:#fdfaf6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:32px 16px 64px;
    background:var(--bg);
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--brown);
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
  }
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .top h1{
    font-size:24px;
    margin:0;
  }
  .top .sub{
    color:var(--muted);
    font-size:14px;
    margin-top:4px;
  }
  .total-badge{
    background:var(--peach);
    color:var(--brown);
    font-weight:700;
    font-size:14px;
    padding:10px 18px;
    border-radius:999px;
    white-space:nowrap;
  }

  /* --- Pantalla de acceso --- */
  #gate{
    max-width:380px;
    margin:80px auto;
    text-align:center;
  }
  #gate h2{
    font-size:20px;
    margin-bottom:6px;
  }
  #gate p{
    color:var(--muted);
    font-size:14px;
    margin-bottom:24px;
  }
  #gate input{
    width:100%;
    padding:12px 16px;
    border:1.5px solid var(--peach);
    border-radius:10px;
    font-size:15px;
    margin-bottom:14px;
    outline:none;
  }
  #gate input:focus{border-color:var(--orange);}
  #gate button, .reload-btn{
    background:var(--orange);
    color:#fff;
    border:none;
    padding:12px 28px;
    border-radius:30px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  #gate .error{
    color:#c0392b;
    font-size:13px;
    margin-top:10px;
    min-height:16px;
  }

  /* --- Dashboard --- */
  #dashboard{ display:none; }
  .question-card{
    background:#fff;
    border-radius:16px;
    padding:24px 26px;
    margin-bottom:16px;
    box-shadow:0 4px 20px rgba(58,35,24,0.05);
  }
  .question-card h3{
    font-size:15.5px;
    margin:0 0 18px;
    font-weight:700;
  }
  .bar-row{
    display:grid;
    grid-template-columns:1fr 60px;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    font-size:13.5px;
  }
  .bar-label{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .bar-track{
    background:var(--peach-light);
    border-radius:6px;
    height:10px;
    overflow:hidden;
  }
  .bar-fill{
    background:var(--orange);
    height:100%;
    border-radius:6px;
    transition:width .5s ease;
  }
  .bar-count{
    text-align:right;
    font-weight:700;
    color:var(--brown);
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }
  .loading{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }
</style>
</head>
<body>

<div id="gate">
  <h2>Reporte +Pilates</h2>
  <p>Ingresá la clave de acceso para ver los resultados.</p>
  <input type="password" id="keyInput" placeholder="Clave de acceso" autocomplete="off">
  <br>
  <button id="enterBtn">Ver reporte</button>
  <p class="error" id="gateError"></p>
</div>

<div class="wrap" id="dashboard">
  <div class="top">
    <div>
      <h1>Reporte de la encuesta</h1>
      <div class="sub">Resultados agregados de todas las respuestas recibidas</div>
    </div>
    <div class="total-badge" id="totalBadge">— respuestas</div>
  </div>

  <div id="questionsContainer">
    <div class="loading">Cargando resultados…</div>
  </div>
</div>

<script>
  const API_BASE = 'https://TU_API_URL'; // reemplazar con el output api_base_url de Terraform
  const STORAGE_KEY = 'maspilates_report_key';

  const gate = document.getElementById('gate');
  const dashboard = document.getElementById('dashboard');
  const keyInput = document.getElementById('keyInput');
  const gateError = document.getElementById('gateError');

  async function tryLoadReport(apiKey){
    gateError.textContent = '';
    try{
      const res = await fetch(`${API_BASE}/reportes`, {
        headers: { 'x-api-key': apiKey }
      });

      if(res.status === 401 || res.status === 403){
        gateError.textContent = 'Clave incorrecta.';
        localStorage.removeItem(STORAGE_KEY);
        return;
      }
      if(!res.ok){
        gateError.textContent = 'No se pudo cargar el reporte. Probá de nuevo.';
        return;
      }

      const data = await res.json();
      localStorage.setItem(STORAGE_KEY, apiKey);
      renderDashboard(data);
      gate.style.display = 'none';
      dashboard.style.display = 'block';
    }catch(err){
      gateError.textContent = 'Error de conexión con el servidor.';
    }
  }

  function renderDashboard(data){
    document.getElementById('totalBadge').textContent =
      `${data.total_respuestas} ${data.total_respuestas === 1 ? 'respuesta' : 'respuestas'}`;

    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    if(!data.reporte || data.reporte.length === 0){
      container.innerHTML = '<div class="empty-state">Todavía no hay respuestas guardadas.</div>';
      return;
    }

    data.reporte.forEach(pregunta => {
      const maxCantidad = Math.max(...pregunta.opciones.map(o => o.cantidad));
      const card = document.createElement('div');
      card.className = 'question-card';

      const rows = pregunta.opciones.map(o => {
        const pct = maxCantidad > 0 ? Math.round((o.cantidad / maxCantidad) * 100) : 0;
        return `
          <div class="bar-row">
            <div class="bar-label">
              <span>${escapeHtml(o.respuesta)}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            </div>
            <div class="bar-count">${o.cantidad}</div>
          </div>
        `;
      }).join('');

      card.innerHTML = `<h3>${escapeHtml(pregunta.pregunta)}</h3>${rows}`;
      container.appendChild(card);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  document.getElementById('enterBtn').addEventListener('click', () => {
    const key = keyInput.value.trim();
    if(key) tryLoadReport(key);
  });

  keyInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('enterBtn').click();
  });

  // Si ya había una clave guardada en este navegador, probarla directo
  const savedKey = localStorage.getItem(STORAGE_KEY);
  if(savedKey){
    keyInput.value = savedKey;
    tryLoadReport(savedKey);
  }
</script>

</body>
</html>

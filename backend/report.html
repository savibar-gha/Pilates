<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>+Pilates — Reporte de encuesta</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --brown:#3a2318;
    --orange:#e8842a;
    --peach:#f7e6d8;
    --peach-light:#fbf1e8;
    --muted:#8a7462;
    --bg:#fdfaf6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:32px 16px 64px;
    background:var(--bg);
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--brown);
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
  }
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .top h1{
    font-size:24px;
    margin:0;
  }
  .top .sub{
    color:var(--muted);
    font-size:14px;
    margin-top:4px;
  }
  .total-badge{
    background:var(--peach);
    color:var(--brown);
    font-weight:700;
    font-size:14px;
    padding:10px 18px;
    border-radius:999px;
    white-space:nowrap;
  }

  /* --- Pantalla de acceso --- */
  #gate{
    max-width:380px;
    margin:80px auto;
    text-align:center;
  }
  #gate h2{
    font-size:20px;
    margin-bottom:6px;
  }
  #gate p{
    color:var(--muted);
    font-size:14px;
    margin-bottom:24px;
  }
  #gate input{
    width:100%;
    padding:12px 16px;
    border:1.5px solid var(--peach);
    border-radius:10px;
    font-size:15px;
    margin-bottom:14px;
    outline:none;
  }
  #gate input:focus{border-color:var(--orange);}
  #gate button, .reload-btn{
    background:var(--orange);
    color:#fff;
    border:none;
    padding:12px 28px;
    border-radius:30px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  #gate .error{
    color:#c0392b;
    font-size:13px;
    margin-top:10px;
    min-height:16px;
  }

  /* --- Dashboard --- */
  #dashboard{ display:none; }
  .question-card{
    background:#fff;
    border-radius:16px;
    padding:24px 26px;
    margin-bottom:16px;
    box-shadow:0 4px 20px rgba(58,35,24,0.05);
  }
  .question-card h3{
    font-size:15.5px;
    margin:0 0 18px;
    font-weight:700;
  }
  .bar-row{
    display:grid;
    grid-template-columns:1fr 60px;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    font-size:13.5px;
  }
  .bar-label{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .bar-track{
    background:var(--peach-light);
    border-radius:6px;
    height:10px;
    overflow:hidden;
  }
  .bar-fill{
    background:var(--orange);
    height:100%;
    border-radius:6px;
    transition:width .5s ease;
  }
  .bar-count{
    text-align:right;
    font-weight:700;
    color:var(--brown);
    white-space:nowrap;
  }
  .bar-pct{
    font-weight:400;
    color:var(--muted);
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }
  .loading{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }
</style>
</head>
<body>

<div id="gate">
  <h2>Reporte +Pilates</h2>
  <p>Iniciá sesión con tu cuenta de staff para ver los resultados.</p>
  <button id="loginBtn">Iniciar sesión</button>
  <p class="error" id="gateError"></p>
</div>

<div class="wrap" id="dashboard">
  <div class="top">
    <div>
      <h1>Reporte de la encuesta</h1>
      <div class="sub">Resultados agregados de todas las respuestas recibidas</div>
    </div>
    <div class="total-badge" id="totalBadge">— respuestas</div>
  </div>

  <div id="questionsContainer">
    <div class="loading">Cargando resultados…</div>
  </div>
</div>

<script>
  // --- Completar estos 3 valores con los outputs de Terraform ---
  const API_BASE          = 'https://jnljl8iff1.execute-api.us-east-1.amazonaws.com';
  const COGNITO_DOMAIN     = 'maspilates-encuesta-report.auth.us-east-1.amazoncognito.com';
  const COGNITO_CLIENT_ID  = '5iieidctajmsdud3kf4rrib06j';
  // ----------------------------------------------------------------

  const TOKEN_KEY = 'maspilates_id_token';
  const REDIRECT_URI = window.location.origin + window.location.pathname;

  const gate = document.getElementById('gate');
  const dashboard = document.getElementById('dashboard');
  const gateError = document.getElementById('gateError');

  function loginUrl(){
    const params = new URLSearchParams({
      client_id: COGNITO_CLIENT_ID,
      response_type: 'token',
      scope: 'openid email',
      redirect_uri: REDIRECT_URI
    });
    return `https://${COGNITO_DOMAIN}/login?${params.toString()}`;
  }

  function captureTokenFromUrl(){
    if(window.location.hash.includes('id_token')){
      const params = new URLSearchParams(window.location.hash.substring(1));
      const idToken = params.get('id_token');
      if(idToken){
        localStorage.setItem(TOKEN_KEY, idToken);
        history.replaceState(null, '', window.location.pathname); // limpiar el hash de la URL
      }
    }
  }

  async function loadReport(){
    captureTokenFromUrl();
    const token = localStorage.getItem(TOKEN_KEY);

    if(!token){
      showGate();
      return;
    }

    try{
      const res = await fetch(`${API_BASE}/reportes`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      if(res.status === 401 || res.status === 403){
        localStorage.removeItem(TOKEN_KEY);
        gateError.textContent = 'Tu sesión expiró, iniciá sesión de nuevo.';
        showGate();
        return;
      }
      if(!res.ok){
        gateError.textContent = 'No se pudo cargar el reporte. Probá de nuevo.';
        showGate();
        return;
      }

      const data = await res.json();
      renderDashboard(data);
      showDashboard();
    }catch(err){
      gateError.textContent = 'Error de conexión con el servidor.';
      showGate();
    }
  }

  function showGate(){
    gate.style.display = 'block';
    dashboard.style.display = 'none';
  }

  function showDashboard(){
    gate.style.display = 'none';
    dashboard.style.display = 'block';
  }

  function renderDashboard(data){
    document.getElementById('totalBadge').textContent =
      `${data.total_respuestas} ${data.total_respuestas === 1 ? 'respuesta' : 'respuestas'}`;

    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    if(!data.reporte || data.reporte.length === 0){
      container.innerHTML = '<div class="empty-state">Todavía no hay respuestas guardadas.</div>';
      return;
    }

    data.reporte.forEach(pregunta => {
      const maxCantidad = Math.max(...pregunta.opciones.map(o => o.cantidad));
      const totalPregunta = pregunta.opciones.reduce((sum, o) => sum + o.cantidad, 0);
      const card = document.createElement('div');
      card.className = 'question-card';

      const rows = pregunta.opciones.map(o => {
        const barPct = maxCantidad > 0 ? Math.round((o.cantidad / maxCantidad) * 100) : 0;
        const porcentaje = typeof o.porcentaje === 'number'
          ? o.porcentaje
          : (totalPregunta > 0 ? Math.round((o.cantidad / totalPregunta) * 1000) / 10 : 0);
        return `
          <div class="bar-row">
            <div class="bar-label">
              <span>${escapeHtml(o.respuesta)}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div>
            </div>
            <div class="bar-count">${o.cantidad} <span class="bar-pct">(${porcentaje}%)</span></div>
          </div>
        `;
      }).join('');

      card.innerHTML = `<h3>${escapeHtml(pregunta.pregunta)}</h3>${rows}`;
      container.appendChild(card);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  document.getElementById('loginBtn').addEventListener('click', () => {
    window.location.href = loginUrl();
  });

  loadReport();
</script>

</body>
</html>
